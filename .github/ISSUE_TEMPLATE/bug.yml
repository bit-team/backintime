name: Bug report
description: Submit a bug report
body:
  - type: markdown
    attributes:
      value: |
        🌸 The project is maintained by volunteers in their free time, human beings just like you. So be respectful and constructive.
        🚫 **Zero tolerance for AI slop**
        👉 Provide the output of the console command `backintime --diagnostics`, to help us diagnose the problem quickly.        
        👉 Please specify as precisely as you can the package or installation source where you got _Back In Time_ from.
        👉 Ask **support questions** in the GNU/Linux community or on our [mailing list](https://mail.python.org/mailman3/lists/bit-dev.python.org). Please respect the limited resources of the maintenance team.
  - type: textarea
    attributes:
      label: "‎"
      value: |
        🚫 AI-generated code submissions are not welcome. 🚫
        ⚠️ If you cannot demonstrate full authorship, understanding, and responsibility for your submitted content, your account might be reported to the GitHub/Microsoft abuse team without warning.
        
        ---
