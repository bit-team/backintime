<svg xmlns="http://www.w3.org/2000/svg" width="70" height="20" role="img" aria-label="ℹ: SemVer">
	<title>ℹ: SemVer</title>
	<a target="_blank" rel="noopener noreferrer" href="https://semver.org/">
		<filter id="blur"><feGaussianBlur stdDeviation="16"/></filter>
		<linearGradient id="s" x2="0" y2="100%"><stop offset="0" stop-color="#bbb" stop-opacity=".1"/><stop offset="1" stop-opacity=".1"/></linearGradient><clipPath id="r"><rect width="70" height="20" rx="3"/></clipPath>
		<g clip-path="url(#r)">
			<rect width="17" height="20" fill="#555"/><rect x="17" width="53" height="20" fill=" #0f92d8"/>
			<rect width="70" height="20" fill="url(#s)"/>
		</g>
		<g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
			<g transform="scale(.1)">
				<g aria-hidden="true" fill="#010101">
					<text x="95" y="150" fill-opacity=".8" filter="url(#blur)" textLength="70">ℹ</text>
					<text x="95" y="150" fill-opacity=".3" textLength="70">ℹ</text>
				</g>
				<text x="95" y="140" textLength="70">ℹ</text>
			</g>
			<g transform="scale(.1)">
				<g aria-hidden="true" fill="#010101">
					<text x="425" y="150" fill-opacity=".8" filter="url(#blur)" textLength="430">SemVer</text>
					<text x="425" y="150" fill-opacity=".3" textLength="430">SemVer</text>
				</g>
				<text x="425" y="140" textLength="430">SemVer</text>
			</g>
		</g>
	</a>
</svg>
